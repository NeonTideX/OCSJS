name: Bug report
description: Report a reproducible problem in OCSJS Extended.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include release version, standard/common variant, OS, browser, and userscript manager versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Affected integration and reproduction
      description: Describe the platform and minimal steps. Do not share credentials or private course material.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Remove session cookies, answer-provider tokens, account data, and private URLs.
