name: Bug report
description: Report an OCSJS V1 behavior or compatibility issue
title: '[Bug]: '
labels: [bug]
body:
  - type: input
    id: platform
    attributes:
      label: Platform and page type
      description: Include the hostname and course, homework or exam variant.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and userscript manager versions
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction, expected behavior and actual behavior
      description: Include a minimal example. Remove tokens, private course text and account information.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
