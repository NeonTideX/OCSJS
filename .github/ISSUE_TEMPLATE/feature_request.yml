name: Feature request
description: Suggest an improvement to the independent browser assistant
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected workflow
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and an example
    validations:
      required: true
