name: Feature request
description: Propose a focused improvement to OCSJS Extended.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Include affected integrations and any permission or compatibility implications.
    validations:
      required: true
