name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node ${{ matrix.node }} / core validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install isolated test browser
        if: matrix.node == 26
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Browser integration checks
        if: matrix.node == 26
        run: pnpm test:browser
      - name: Upload userscripts and verification evidence
        if: matrix.node == 26 && always()
        uses: actions/upload-artifact@v4
        with:
          name: ocsjs-v1-verification
          include-hidden-files: true
          path: |
            dist/
            .artifacts/
