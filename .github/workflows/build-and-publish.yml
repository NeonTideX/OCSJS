name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Tag and package version differ')"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc
      - run: pnpm test
      - run: pnpm build
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/ocs.user.js dist/ocs.common.user.js dist/ocs.meta.js dist/core.js dist/index.js dist/style.css release/
          cp LICENSE THIRD_PARTY_LICENSES/OCSJS-MIT.txt THIRD_PARTY_LICENSES/THIRD_PARTY_NOTICES.md release/
          cd release
          sha256sum ocs.user.js ocs.common.user.js ocs.meta.js core.js index.js style.css LICENSE OCSJS-MIT.txt THIRD_PARTY_NOTICES.md > SHA256SUMS
      - name: Prepare release notes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line.startsWith('## [' + version + ']'));
          if (start < 0) throw new Error('Missing version changelog entry');
          const end = lines.findIndex((line, index) => index > start && (line.startsWith('## ') || line.startsWith('[Unreleased]:')));
          fs.writeFileSync('release-notes.md', lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim() + '\n\nDownload the standard ocs.user.js for normal use. The common variant grants broader network access. Verify assets against SHA256SUMS. Complete corresponding source is available in the source archives for this tag.\n');
          NODE
      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "OCSJS Extended $RELEASE_TAG" --notes-file release-notes.md --latest
