name: Publish V1
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:browser
      - name: Check release version
        run: node -e "if (require('./package.json').version !== '1.0.0') process.exit(1)"
      - name: Publish tested commit as V1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --force v1 "$GITHUB_SHA"
          git push origin refs/tags/v1 --force
          if gh release view v1 >/dev/null 2>&1; then
            gh release edit v1 --title 'OCSJS V1' --notes-file docs/RELEASE_NOTES.md --latest
          else
            gh release create v1 --verify-tag --title 'OCSJS V1' --notes-file docs/RELEASE_NOTES.md --latest
          fi
          gh release upload v1 dist/ocs.user.js dist/ocs.meta.js dist/ocs.common.user.js dist/ocs.common.meta.js dist/SHA256SUMS dist/LICENSE dist/OCSJS-MIT.txt dist/THIRD_PARTY_NOTICES.md --clobber
